<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>NOVEX Börse</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  /* Layout: Handelsterminal – Kopfzeile mit Börsenuhr & Konto, Kurs-Laufband, Tabs; darunter Raster aus Chart/Kennzahlen links und Orderticket/Orderbuch rechts */
  --bg:#0a0e13; --panel:#10161e; --panel2:#0c1218; --line:#1c2631; --line2:#2a3746;
  --fg:#d8e1ea; --mute:#7b8a9c; --accent:#f2a93b; --accent-ink:#1b1204;
  --up:#25b37f; --dn:#ef5361; --upbg:rgba(37,179,127,.14); --dnbg:rgba(239,83,97,.14);
  --grid:rgba(123,138,156,.14); --shadow:0 10px 30px rgba(0,0,0,.4);
  --f-disp:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#edf0f4; --panel:#ffffff; --panel2:#f5f7fa; --line:#dbe2ea; --line2:#c6d0db;
    --fg:#111924; --mute:#586677; --accent:#b06d05; --accent-ink:#ffffff;
    --up:#0b8f63; --dn:#d12f3d; --upbg:rgba(11,143,99,.1); --dnbg:rgba(209,47,61,.1);
    --grid:rgba(88,102,119,.16); --shadow:0 10px 30px rgba(20,30,45,.13); color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#edf0f4; --panel:#ffffff; --panel2:#f5f7fa; --line:#dbe2ea; --line2:#c6d0db;
  --fg:#111924; --mute:#586677; --accent:#b06d05; --accent-ink:#ffffff;
  --up:#0b8f63; --dn:#d12f3d; --upbg:rgba(11,143,99,.1); --dnbg:rgba(209,47,61,.1);
  --grid:rgba(88,102,119,.16); --shadow:0 10px 30px rgba(20,30,45,.13); color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:13px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.up{color:var(--up)} .dn{color:var(--dn)} .mute{color:var(--mute)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-disp);font-weight:800;font-size:20px;letter-spacing:.04em;display:flex;align-items:baseline;gap:6px}
.brand b{color:var(--accent)}
.brand small{font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.clock{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:11px;font-family:var(--f-body);font-weight:600;letter-spacing:.03em}
.pill.open{background:var(--upbg);color:var(--up)}
.pill.open::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.pause{background:var(--dnbg);color:var(--dn)}
.speed{display:flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.speed button{background:none;border:0;padding:4px 9px;font-size:12px;font-family:var(--f-mono);color:var(--mute)}
.speed button+button{border-left:1px solid var(--line2)}
.speed button.on{background:var(--accent);color:var(--accent-ink)}
.acct{margin-left:auto;display:flex;gap:18px;flex-wrap:wrap}
.acct div{display:flex;flex-direction:column}
.acct span{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.07em}
.acct b{font-family:var(--f-mono);font-weight:500;font-size:13.5px}
.btn-ghost{background:none;border:1px solid var(--line2);border-radius:7px;padding:5px 10px;font-size:12px}
.btn-ghost:hover{border-color:var(--accent)}

/* Laufband */
.tape{overflow:hidden;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.tape-in{display:inline-flex;gap:28px;padding:6px 0;animation:tape 90s linear infinite;font-family:var(--f-mono);font-size:12px}
.tape-in span b{font-weight:500;color:var(--mute);margin-right:6px}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.tape-in{animation:none}}

/* Navigation */
.nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--panel);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-weight:500;color:var(--mute);white-space:nowrap}
.nav button:hover{color:var(--fg)}
.nav button.on{color:var(--fg);border-bottom-color:var(--accent)}

main{padding-block:16px 60px;max-width:1500px;margin:0 auto}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance}
h1{font-size:24px;font-weight:700;letter-spacing:.005em}
h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:10px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}

/* Markt */
.grid-mkt{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}
.grid-mkt .span2{grid-column:1/-1}
@media (max-width:900px){.grid-mkt{grid-template-columns:minmax(0,1fr)}}
.idx-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.bigpx{font-family:var(--f-mono);font-size:26px;font-weight:500}
.bigch{font-family:var(--f-mono);font-size:14px;margin-left:10px}
.movers{display:grid;gap:12px}
.mv-row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mv-row:hover b{color:var(--accent)}
.mv-row b{font-weight:600}
.heat{display:flex;flex-wrap:wrap;gap:3px}
.heat div{flex:1 1 auto;min-width:74px;padding:10px 8px;border-radius:5px;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:#fff}
.heat div b{font-family:var(--f-disp);font-size:13px;letter-spacing:.03em}
.heat div span{font-family:var(--f-mono);font-size:11.5px;opacity:.95}
.news-item{padding:7px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px}
.news-item time{font-family:var(--f-mono);color:var(--mute);font-size:11.5px}
.news-item.pos p::before,.news-item.neg p::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;vertical-align:1px}
.news-item.pos p::before{background:var(--up)} .news-item.neg p::before{background:var(--dn)}
.news-item p{margin:0}

/* Tabellen */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);font-weight:600;text-align:right;padding:7px 9px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td.nm{font-family:var(--f-body)}
td.nm b{font-weight:600;display:block}
td.nm small{color:var(--mute);font-family:var(--f-mono);font-size:11px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
.chg{display:inline-block;min-width:68px;padding:1px 6px;border-radius:4px}
.chg.up{background:var(--upbg)} .chg.dn{background:var(--dnbg)}
.spark{display:block}
.tag{display:inline-block;font-family:var(--f-body);font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--panel2);border:1px solid var(--line2);color:var(--mute)}
.list-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.list-head p{margin:4px 0 0;color:var(--mute);max-width:70ch}

/* Detail */
.dhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.dhead .back{background:none;border:1px solid var(--line2);border-radius:7px;padding:6px 10px}
.dhead .ttl{flex:1 1 260px;min-width:0}
.dpx{text-align:right}
.dpx .ba{font-family:var(--f-mono);font-size:12px;color:var(--mute)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;align-items:start}
@media (max-width:1000px){.detail{grid-template-columns:minmax(0,1fr)}}
.tfbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tfbar button{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:3px 9px;font-size:12px;color:var(--mute)}
.tfbar button.on{color:var(--fg);border-color:var(--accent)}
.tfbar .sp{flex:1}
canvas.chart{width:100%;height:360px;display:block;touch-action:pan-y}
canvas.chart.sm{height:230px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 18px}
.stats div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.stats span{color:var(--mute)}
.stats b{font-family:var(--f-mono);font-weight:500;text-align:right}
.desc{color:var(--mute);margin:10px 0 0;max-width:75ch}

/* Orderbuch */
.book{font-family:var(--f-mono);font-size:12px}
.book .r{display:grid;grid-template-columns:1fr 1fr 1fr;padding:2px 6px;position:relative}
.book .r span{position:relative;z-index:1;text-align:right}
.book .r span:first-child{text-align:left}
.book .r i{position:absolute;top:1px;bottom:1px;right:0;border-radius:2px}
.book .ask i{background:var(--dnbg)} .book .bid i{background:var(--upbg)}
.book .ask span:first-child{color:var(--dn)} .book .bid span:first-child{color:var(--up)}
.book .hd{color:var(--mute);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.book .mid{padding:6px;text-align:center;border-block:1px solid var(--line);margin:3px 0;color:var(--mute)}
.ts .r{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;font-family:var(--f-mono);font-size:12px;padding:2px 0}
.ts .r span{text-align:right}
.ts .me{background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:3px}

/* Ticket */
.ticket{display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:none;border:0;padding:8px 6px;font-weight:600;color:var(--mute)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on.b{background:var(--up);color:#fff}
.seg button.on.s{background:var(--dn);color:#fff}
.seg button.on.n{background:var(--accent);color:var(--accent-ink)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select,select.inp{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:8px 10px;width:100%;min-width:0;font-family:var(--f-mono)}
.fld input:focus,.fld select:focus{border-color:var(--accent);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips button{background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:3px 9px;font-size:11.5px;font-family:var(--f-mono)}
.chips button:hover{border-color:var(--accent)}
.est{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.est div{display:flex;justify-content:space-between;gap:10px}
.est span{color:var(--mute)}
.est b{font-family:var(--f-mono);font-weight:500;text-align:right}
.est .tot{border-top:1px solid var(--line2);padding-top:5px;margin-top:3px}
.warn{color:var(--accent);font-size:12px}
.err{color:var(--dn);font-size:12px;min-height:1em}
.ok{color:var(--up);font-size:12px}
.go{border:0;border-radius:8px;padding:11px;font-weight:700;font-size:14px;color:#fff;letter-spacing:.02em}
.go.b{background:var(--up)} .go.s{background:var(--dn)} .go.n{background:var(--accent);color:var(--accent-ink)}
.go:disabled{opacity:.5;cursor:not-allowed}
.note{font-size:12px;color:var(--mute);margin:0}

/* Depot */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.tile b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:500;margin-top:3px}
.act{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:3px 8px;font-size:11.5px;font-family:var(--f-body)}
.act:hover{border-color:var(--accent)}
.act.x:hover{border-color:var(--dn);color:var(--dn)}
.empty{color:var(--mute);padding:14px 0}
.dv-grid{display:grid;grid-template-columns:380px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1000px){.dv-grid{grid-template-columns:minmax(0,1fr)}}

/* Toasts & Modal */
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:8px;padding:9px 12px;box-shadow:var(--shadow);font-size:12.5px;animation:tin .2s ease-out}
.toast.up{border-left-color:var(--up)} .toast.dn{border-left-color:var(--dn)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto}
.modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:12px;max-width:640px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.modal p{margin:0;color:var(--mute);max-width:70ch}
.modal ul{margin:0;padding-left:18px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
@media (max-width:600px){
  .acct{margin-left:0;width:100%;justify-content:space-between}
  canvas.chart{height:280px}
  h1{font-size:20px}
}

/* Mehrspieler-Ergänzungen */
.conn{font-size:11px;color:var(--mute);display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.conn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dn)}
.conn.on::before{background:var(--up)}
.pill.closed{background:var(--panel2);color:var(--mute);border:1px solid var(--line2)}
.user{display:flex;align-items:center;gap:8px}
.user b{font-weight:600}
.auth{max-width:440px;margin:40px auto;display:flex;flex-direction:column;gap:14px}
.auth .card{display:flex;flex-direction:column;gap:12px;padding:22px}
.auth h1{font-size:28px}
.auth p{margin:0;color:var(--mute)}
.bank-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.bigval{font-family:var(--f-mono);font-size:26px;font-weight:500}
.meter{height:8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.streak{display:flex;gap:5px}
.streak span{flex:1;height:8px;border-radius:3px;background:var(--panel2);border:1px solid var(--line2)}
.streak span.on{background:var(--up);border-color:var(--up)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.item{border:1px solid var(--line2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--panel2)}
.item h3{font-size:15px}
.item .px{font-family:var(--f-mono);font-size:15px}
.item p{margin:0;color:var(--mute);font-size:12px}
.item .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.item.own{border-color:var(--accent)}
.badge{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-weight:600;letter-spacing:.02em}
.ach{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.ach b{font-weight:600}
.ach small{color:var(--mute);grid-column:1}
.ach .rw{font-family:var(--f-mono);grid-row:1/3;grid-column:2;align-self:center}
.ach.done b::before{content:"✓ ";color:var(--up)}
.ach.done .rw{color:var(--up)}
tr.me td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;padding:7px 12px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line2)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.kv span{color:var(--mute)} .kv b{font-family:var(--f-mono);font-weight:500;text-align:right}
.lock{color:var(--mute);font-size:11px}
th.l,td.l{text-align:left}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand">NOVEX<b>·</b><small>Börse</small></div>
    <div class="clock"><span id="clk">–</span><span id="mstat" class="pill closed">…</span><span id="conn" class="conn">offline</span></div>
    <div class="acct" id="acct"></div>
    <div class="user" id="user"></div>
  </div>
</header>
<div class="tape" id="tapebar" hidden><div class="tape-in" id="tape"></div></div>
<nav class="nav wrap" id="nav" hidden></nav>
<main class="wrap" id="view"><div class="empty">Lade …</div></main>
<div id="toasts" aria-live="polite"></div>
<div class="modal" id="modal" hidden></div>
<script type="module" src="./app.js"></script>
</body>
</html>
