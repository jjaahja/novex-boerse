<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>NOVEX Börse</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Neobroker-Layout: ruhige weiße Fläche, eine Schrift, 1px-Linien, Farbe nur für Kursbewegungen */
  --bg:#ffffff; --bg2:#f4f4f5; --fg:#0d0d0f; --fg2:#55555d; --mute:#8b8b94; --line:#ececee; --line2:#dcdce0;
  --up:#0b8a4c; --dn:#d1293d; --upbg:rgba(11,138,76,.09); --dnbg:rgba(209,41,61,.08); --warn:#b26a00; --warnbg:rgba(178,106,0,.1);
  --btn:#0d0d0f; --btnfg:#ffffff; --scrim:rgba(13,13,15,.32); --pop:0 10px 30px rgba(13,13,15,.08);
  --f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b0b0c; --bg2:#18181b; --fg:#f2f2f4; --fg2:#b4b4bc; --mute:#7a7a84; --line:#212125; --line2:#303036;
  --up:#33c27a; --dn:#ff5d5d; --upbg:rgba(51,194,122,.12); --dnbg:rgba(255,93,93,.11); --warn:#f0a63a; --warnbg:rgba(240,166,58,.13);
  --btn:#f2f2f4; --btnfg:#0b0b0c; --scrim:rgba(0,0,0,.55); --pop:0 10px 30px rgba(0,0,0,.5); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0b0b0c; --bg2:#18181b; --fg:#f2f2f4; --fg2:#b4b4bc; --mute:#7a7a84; --line:#212125; --line2:#303036;
  --up:#33c27a; --dn:#ff5d5d; --upbg:rgba(51,194,122,.12); --dnbg:rgba(255,93,93,.11); --warn:#f0a63a; --warnbg:rgba(240,166,58,.13);
  --btn:#f2f2f4; --btnfg:#0b0b0c; --scrim:rgba(0,0,0,.55); --pop:0 10px 30px rgba(0,0,0,.5); color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:6px}
.up{color:var(--up)} .dn{color:var(--dn)} .mute{color:var(--mute)} .fg2{color:var(--fg2)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* Kopfzeile */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:28px;height:60px}
.logo{font-weight:700;letter-spacing:.08em;font-size:15px;background:none;border:0;padding:0}
.tabs{display:flex;gap:2px}
.tabs button{background:none;border:0;padding:8px 14px;border-radius:999px;color:var(--fg2);font-weight:500;font-size:14px;position:relative}
.tabs button:hover{color:var(--fg)}
.tabs button.on{background:var(--bg2);color:var(--fg)}
.tabs .badge,.bnav .badge{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--up)}
.status{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--fg2);white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mute);margin-right:6px;vertical-align:1px}
.dot.on{background:var(--up)}
.me{background:none;border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.bnav{display:none}
@media (max-width:760px){
  .tabs{display:none}
  .status .clk{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bnav button{background:none;border:0;font-size:11px;font-weight:500;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px;position:relative}
  .bnav button.on{color:var(--fg)}
  .bnav svg{width:22px;height:22px}
}
main{padding-block:28px 110px}

/* Typografie */
.h1{font-size:28px;font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance}
.big{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.label{font-size:13px;color:var(--fg2);display:flex;align-items:center;gap:6px}
.lead{color:var(--fg2);margin:6px 0 0;max-width:62ch}
.small{font-size:13px}
.sec{border-top:1px solid var(--line);padding-block:24px}
.sec:first-child{border-top:0;padding-top:0}
.sec>h2,.sh{font-size:17px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:8px;letter-spacing:-.005em}
.sh .sp{flex:1}
.grid2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:56px;align-items:start}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr);gap:0}}
.only-wide{display:none}
@media (min-width:981px){.only-wide{display:block}.only-narrow{display:none}.side-sticky{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;scrollbar-width:thin}}
.pos .pos-top{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.pos .big2{font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#d-pos .pos{margin-top:22px}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.delta{font-size:15px;font-weight:500}

/* Zeilen */
.rows{display:flex;flex-direction:column}
.r{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.r:hover .nm{text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.r.noav{grid-template-columns:minmax(0,1fr) auto auto}
.av{width:40px;height:40px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--fg2)}
.nm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.val{text-align:right;white-space:nowrap}
.val b{font-weight:500;display:block}
.val small{font-size:13px}
.spark{display:block}
@media (max-width:560px){.r .spk{display:none}.r{grid-template-columns:40px minmax(0,1fr) auto}}

/* Bedienelemente */
.seg{display:inline-flex;background:var(--bg2);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--fg2);white-space:nowrap}
.seg button.on{background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--fg2);white-space:nowrap}
.chip:hover{color:var(--fg)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:600;background:var(--btn);color:var(--btnfg);font-size:15px;white-space:nowrap}
.btn.ghost{background:none;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn.full{width:100%}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1}
.link{background:none;border:0;padding:0;font-weight:500;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;color:var(--fg2);display:flex;align-items:center;gap:6px}
.inp{background:var(--bg2);border:1px solid transparent;border-radius:10px;padding:11px 14px;width:100%;min-width:0}
.inp:focus{outline:none;border-color:var(--fg2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amount{font-size:34px;font-weight:600;letter-spacing:-.025em;border:0;background:none;width:100%;padding:2px 0;min-width:0}
.amount:focus{outline:none}
.amount-wrap{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line2);padding-bottom:6px}
.amount-wrap .unit{font-size:20px;font-weight:600;color:var(--fg2)}
.toggle{position:relative;width:44px;height:26px;border-radius:999px;background:var(--line2);border:0;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--bg);transition:transform .2s}
.toggle.on{background:var(--fg)}
.toggle.on::after{transform:translateX(18px)}
.setting{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.setting .t{flex:1;min-width:0}
.setting .t b{font-weight:500;display:flex;align-items:center;gap:6px}
.setting .t small{color:var(--fg2);font-size:13px}
details.more{border-top:1px solid var(--line)}
details.more>summary{list-style:none;cursor:pointer;padding:16px 0;font-weight:500;display:flex;justify-content:space-between}
details.more>summary::after{content:"+";color:var(--mute);font-weight:400}
details.more[open]>summary::after{content:"–"}
details.more>summary::-webkit-details-marker{display:none}

/* Kennzahlen */
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));column-gap:32px}
.kv>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.kv span{color:var(--fg2);display:flex;align-items:center;gap:6px;min-width:0}
.kv b{font-weight:500;text-align:right;white-space:nowrap}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.figs>div{padding:14px 16px 14px 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.figs>div+div{padding-left:16px;border-left:1px solid var(--line)}
.figs b{font-size:18px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:981px) and (max-width:1300px){.figs b{font-size:16px}}
@media (max-width:560px){.figs{grid-template-columns:1fr 1fr}.figs>div:nth-child(3){padding-left:0;border-left:0}.figs>div:nth-child(n+3){border-top:1px solid var(--line)}}
.lines>div{display:flex;justify-content:space-between;gap:16px;padding:7px 0}
.lines span{color:var(--fg2);display:flex;align-items:center;gap:6px}
.lines b{font-weight:500;text-align:right}
.lines .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:12px}
.lines .tot b,.lines .tot span{font-weight:600;color:var(--fg)}
.note{font-size:13px;color:var(--fg2);margin:0}
.warn{font-size:13px;color:var(--dn);margin:0}
.err{font-size:14px;color:var(--dn);min-height:1em;margin:0}
.meter{height:6px;border-radius:999px;background:var(--bg2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--fg);border-radius:999px}
.alloc{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;margin:6px 0 14px}
.alloc i{display:block;min-width:2px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 24px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:8px;height:8px;border-radius:2px;flex:none}
.legend b{margin-left:auto;font-weight:500}

/* Erklärungen */
.i{width:16px;height:16px;border-radius:50%;border:1px solid var(--line2);background:none;color:var(--mute);font-size:10px;font-weight:700;line-height:1;padding:0;display:inline-grid;place-items:center;flex:none;cursor:help;font-style:normal}
.i:hover,.i[aria-expanded="true"]{color:var(--fg);border-color:var(--fg2)}
.pop{position:absolute;z-index:80;width:min(330px,calc(100vw - 32px));background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:14px 16px;box-shadow:var(--pop);font-size:14px;animation:fade .15s ease-out}
.pop h4{margin:0 0 6px;font-size:14px;font-weight:600}
.pop p{margin:0;color:var(--fg2)}
.pop .so{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--fg)}
.pop .so::before{content:"Was bedeutet das für meinen Trade? ";font-weight:600;display:block;margin-bottom:2px}
.why{display:flex;gap:8px;align-items:baseline;font-size:14px;color:var(--fg2);margin-top:4px}
.why b{color:var(--fg);font-weight:500}

/* Nachrichten & Kalender */
.news{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:6px}
.news .meta{font-size:12px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.news h3{font-size:16px;font-weight:600;margin:0;line-height:1.35;text-wrap:pretty}
.news p{margin:0;color:var(--fg2);font-size:14px;max-width:72ch}
.news .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;font-weight:500;border:1px solid var(--line2);border-radius:6px;padding:2px 8px;color:var(--fg2);background:none;white-space:nowrap}
button.tag:hover{color:var(--fg);border-color:var(--fg2)}
.eff{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
.eff.up{background:var(--upbg)} .eff.dn{background:var(--dnbg)}
.rumor{font-size:12px;font-weight:600;color:var(--fg2);border:1px dashed var(--line2);border-radius:6px;padding:1px 7px}
.cal-day{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px}
.cal-day .d{font-weight:600;font-size:14px}
.cal-day .d small{display:block;color:var(--mute);font-weight:400}
.cal-item{display:flex;gap:10px;align-items:baseline;padding:3px 0;font-size:14px;flex-wrap:wrap}
.cal-item .k{font-size:12px;color:var(--mute);min-width:64px}
@media (max-width:560px){.cal-day{grid-template-columns:1fr;gap:6px}}

/* Tabellen */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--mute);font-weight:500;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:last-child,td:last-child{padding-right:0}
tr.mine td{font-weight:600}

/* Charts */
.chart-wrap{position:relative}
canvas.chart{width:100%;height:280px;display:block;touch-action:pan-y}
canvas.chart.sm{height:200px}
canvas.bars{width:100%;height:180px;display:block}
.ranges{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap;align-items:center}
.ranges button{border:0;background:none;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:500;color:var(--fg2)}
.ranges button.on{background:var(--bg2);color:var(--fg)}
.ranges .sp{flex:1}
.ranges button.i{padding:0;border:1px solid var(--line2);border-radius:50%;background:none;color:var(--mute);font-size:10px;font-weight:700;margin-left:4px}
.link{text-align:left}

/* Order-Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s ease-out}
.sheet{background:var(--bg);border-radius:18px;width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow:auto;padding:24px;display:flex;flex-direction:column;gap:18px;animation:rise .22s cubic-bezier(.2,.8,.2,1)}
.sheet .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet .top h3{margin:0;font-size:19px;font-weight:600}
.x{background:var(--bg2);border:0;border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1;color:var(--fg2);flex:none}
@media (max-width:600px){.scrim{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;max-width:none;max-height:92vh;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 0}
.done svg{width:64px;height:64px}
.done circle{fill:none;stroke:var(--up);stroke-width:3;stroke-dasharray:176;stroke-dashoffset:176;animation:draw .5s ease-out forwards}
.done path{fill:none;stroke:var(--up);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .35s .4s ease-out forwards}
.done.fail circle,.done.fail path{stroke:var(--dn)}
.done h3{margin:4px 0 0;font-size:20px}

/* Rückmeldungen */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100vw - 32px));pointer-events:none}
@media (max-width:760px){.toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.toast{background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 16px;font-size:14px;animation:rise .25s ease-out;display:flex;gap:10px;align-items:flex-start;pointer-events:auto}
.toast .m{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--mute)}
.toast.up .m,.toast.div .m,.toast.tier .m,.toast.ath .m{background:var(--up)}
.toast.dn .m{background:var(--dn)}
.toast.div .m{animation:pulse 1.1s ease-out 2}
.celebrate{border:1px solid var(--line2);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;margin-bottom:20px;display:flex;align-items:center;gap:14px}
.celebrate::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,var(--upbg) 50%,transparent 70%);transform:translateX(-100%);animation:sweep 1.8s ease-out 1 .2s}
.celebrate b{font-weight:600}
.flash-up{animation:fu .8s ease-out} .flash-dn{animation:fd .8s ease-out}
@keyframes fu{from{background:var(--upbg)}to{background:transparent}}
@keyframes fd{from{background:var(--dnbg)}to{background:transparent}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--up)}100%{box-shadow:0 0 0 8px transparent}}
@keyframes sweep{to{transform:translateX(100%)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}.done circle,.done path{stroke-dashoffset:0}}

/* Anmeldung */
.auth{max-width:420px;margin:48px auto;display:flex;flex-direction:column;gap:18px}
.auth .h1{font-size:32px}
.empty{color:var(--fg2);padding:18px 0;font-size:14px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0 32px}
.item{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.item .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item p{margin:0;color:var(--fg2);font-size:13px}
.ach{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.ach .c{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:11px}
.ach.done .c{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.ach small{grid-column:2;color:var(--fg2);font-size:13px}
.ach .rw{grid-row:1/3;grid-column:3;font-weight:500}
.tiers{display:grid;gap:0}
.tierrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.tierrow .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--fg2)}
.tierrow.got .n{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.tierrow ul{margin:4px 0 0;padding-left:18px;color:var(--fg2);font-size:13px}

/* Kredit-Risiko, Makro, Unternehmen (Bernstein nur für Risiko und Marktstatus) */
.amb{color:var(--warn)}
.meter.big{height:10px}
.meter i.ok{background:var(--up)} .meter i.warn{background:var(--warn)} .meter i.crit{background:var(--dn)}
.meter{position:relative}
.meter .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg2);border-radius:1px}
.alert{border:1px solid var(--dn);border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;background:var(--dnbg)}
.alert.amb{border-color:var(--warn);background:var(--warnbg);color:inherit}
.alert b{display:block;margin-bottom:2px}
.alert .t{flex:1;min-width:220px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.ok{color:var(--up);background:var(--upbg)} .pill.warn{color:var(--warn);background:var(--warnbg)} .pill.crit{color:var(--dn);background:var(--dnbg)} .pill.n{color:var(--fg2);background:var(--bg2)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));border-top:1px solid var(--line)}
.mgrid>div{padding:16px 16px 16px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.mgrid b.v{font-size:24px;font-weight:600;letter-spacing:-.02em}
.mgrid svg{margin-top:6px;max-width:100%}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line)}
.ladder>div{padding:12px 10px 12px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)}
.ladder>div.on{color:var(--fg)}
.ladder>div b{display:block;font-size:15px}
@media (max-width:560px){.ladder{grid-template-columns:1fr 1fr}}
input[type=range]{width:100%;accent-color:var(--fg)}
.stage{font-size:12px;color:var(--fg2)}
</style>
</head>
